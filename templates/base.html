<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Simple Shop{% endblock %}</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

/* ===============================
   GLOBAL RESET & BASE STYLES
================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Merriweather', serif;
    background: #e6f0ff; /* soft deep blue background */
    color: #1a1a1a;
    display: flex;
    min-height: 100vh;
}

/* ===============================
   SIDEBAR MENU
================================ */
.sidebar {
    width: 260px;
    height: 100vh;
    background: #0d1b33; /* deep blue */
    color: #ffffff;
    position: fixed;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 25px 20px;
    box-shadow: 3px 0 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 1000;
}

.sidebar.hidden {
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
}

.sidebar.visible {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
}

.sidebar h1 {
    font-size: 24px;
    font-weight: 800;
    text-transform: uppercase;
    color: #ff8c42; /* bright orange accent */
    margin-bottom: 25px;
    letter-spacing: 1px;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.sidebar nav a {
    color: #cfd9f1;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.3s ease;
    padding: 10px 12px;
    border-radius: 8px;
}

.sidebar nav a:hover {
    background: #1a2a4a;
    color: #ff8c42;
    transform: translateX(3px);
}

.sidebar footer {
    font-size: 13px;
    text-align: center;
    color: #a3b1d1;
    border-top: 1px solid #2a3b5c;
    padding-top: 15px;
}

/* ===============================
   MAIN CONTENT
================================ */
.main-content {
    margin-left: 260px;
    padding: 40px;
    width: calc(100% - 260px);
    transition: margin-left 0.3s ease;
}

.main-content h2 {
    font-size: 26px;
    font-weight: 700;
    color: #0d1b33;
    margin-bottom: 30px;
    text-align: center;
}

/* ===============================
   PRODUCT GRID
================================ */
.product {
    background: #ffffff;
    border-radius: 15px;
    padding: 20px;
    display: inline-block;
    width: 220px;
    margin: 15px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    vertical-align: top;
}

.product:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.product img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    transition: transform 0.3s ease;
}

.product:hover img {
    transform: scale(1.05);
}

.product h3 {
    font-size: 18px;
    margin: 12px 0 6px;
    color: #0d1b33;
    font-weight: 700;
}

.product p {
    font-size: 14px;
    color: #555f77;
    min-height: 50px;
    margin-bottom: 10px;
}

.product strong {
    color: #ff8c42;
    font-size: 16px;
    display: block;
    margin-bottom: 12px;
}

.btn {
    display: inline-block;
    background: #0d1b33;
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}

.btn:hover {
    background: #1a2a4a;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* ===============================
   HAMBURGER MENU BUTTON
================================ */
.menu-btn {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1100;
    width: 35px;
    height: 30px;
    cursor: pointer;
    flex-direction: column;
    justify-content: space-between;
}

.menu-btn span {
    height: 4px;
    width: 100%;
    background: #ff8c42;
    border-radius: 2px;
    transition: all 0.3s ease;
}

/* ===============================
   RESPONSIVE DESIGN
================================ */
@media (max-width: 768px) {
    .sidebar {
        width: 100%;
        height: auto;
        top: 0;
        left: 0;
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        border-radius: 0;
    }

    .sidebar.visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    .menu-btn {
        display: flex;
    }

    .main-content {
        margin-left: 0;
        width: 100%;
        padding: 25px;
    }

    .product {
        width: 48%;
        margin: 10px 1%;
    }
}

@media (max-width: 480px) {
    .product {
        width: 100%;
        margin: 10px 0;
    }

    .main-content {
        padding: 20px;
    }

    .main-content h2 {
        font-size: 22px;
    }
}

/* ===============================
   ORDERS TABLE STYLING
================================ */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 25px rgba(0,0,0,0.1);
}

table th, table td {
    padding: 14px 18px;
    text-align: left;
    border-bottom: 1px solid #e0e5f2;
}

table th {
    background-color: #0d1b33;
    color: #ffffff;
    font-weight: 700;
}

table tr:hover {
    background-color: #f0f4ff;
}

</style>



    </style>
</head>
<body>
    <div class="menu-btn" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</div>

 <div class="sidebar">
    <h1> 🏎️Swag Riding</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/products/">Products</a>
        <a href="/orders/">Orders</a>
    </nav>
    <footer>&copy; 2025 SwagRiding</footer>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script>
function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.classList.toggle('visible');
}
</script>

</body>
</html>
