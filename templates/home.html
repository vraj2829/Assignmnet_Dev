{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h2>Featured Products</h2>
{% for p in products %}
<div class="product">
    <h3>{{ p.name }}</h3>
    <p>{{ p.description }}</p>
    <strong>${{ p.price }}</strong><br>
    <a class="btn" href="/buy/{{ p.id }}/">Buy Now</a>
</div>
{% empty %}
<p>No products available.</p>
{% endfor %}
{% endblock %}
