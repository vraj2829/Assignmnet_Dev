name: Django CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Django setup + migrations
      - name: Run migrations and seed data
        run: |
          source venv/bin/activate
          python app.py || true

      # Step 5: Run Django test (basic import test)
      - name: Run Django sanity test
        run: |
          source venv/bin/activate
          python - <<'EOF'
import django, os
from django.conf import settings
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'app')
django.setup()
print("✅ Django configured successfully.")
EOF

      # Step 6: Build Docker image (optional, remove if not needed)
      - name: Build Docker image
        run: |
          docker build -t django-app .

      # Step 7: Deploy placeholder (customize later)
      - name: Deployment Step
        run: echo "🚀 CI pipeline complete! Ready to deploy."
